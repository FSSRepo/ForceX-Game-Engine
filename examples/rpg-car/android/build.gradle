def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    compileSdk 35
    buildToolsVersion '36.0.0-rc4'
    namespace "com.fss.rpg"

    defaultConfig {
        applicationId "com.fss.rpg"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
	
	compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // los TXD de origen (decenas de MB) no se usan en ejecucion: el juego carga los PNG ya convertidos
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.txd'
    }

    sourceSets {
        main {
            // assets del juego (game/...) compartidos con el ejemplo de escritorio
            assets.srcDirs = ['../core/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
