// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project(":examples:rpg-car:android") {
    apply plugin: "android"

    dependencies {
        implementation project(":examples:rpg-car:core")
        implementation project(":android-backend")
        compileOnly project(":forcex")
        // OpenPL para Android: su PL10 carga libopenpl.so (el jar de escritorio elige openpl/openpl64 por arquitectura)
        implementation files('libs/openpl-android.aar')
    }
}

project(":examples:rpg-car:core") {
    apply plugin: "java-library"

    dependencies {
        // solo para compilar: en runtime lo aporta cada plataforma (jar en escritorio, aar en Android)
        compileOnly files('libs/libopenpl.jar')
        implementation project(":forcex")
        implementation project(":extensions:gtasdk")
        implementation project(":extensions:gui")
    }
}

project(":examples:rpg-car:desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":examples:rpg-car:core")
        implementation project(":desktop-backend")
        compileOnly project(":forcex")
        implementation files('../core/libs/libopenpl.jar')
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}