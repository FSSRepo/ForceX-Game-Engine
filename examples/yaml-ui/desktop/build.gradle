apply plugin: 'application'

sourceSets.main.java.srcDirs = ["src/"]

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def nativeDistDir = isWindows ? '../../../dist/desktop' : '../../../dist/linux'
def fxLibName = isWindows ? 'fxcore.dll' : 'libfxcore.so'

// Copia el binario del engine y los assets de la demo al directorio de trabajo.
task prepareRun(type: Copy) {
    from(nativeDistDir) { include fxLibName }
    from('../core/assets') { into 'assets' }
    into 'build/libs'
}

application {
    mainClass = 'com.fx.demo.desktop.DesktopLauncher'
}

run {
    dependsOn prepareRun
    workingDir = file('build/libs')
    jvmArgs '-Djava.library.path=.'
}
