android {
    compileSdk 35
    buildToolsVersion '36.0.0-rc4'
    namespace "com.fx.demo.rmlui"

    defaultConfig {
        applicationId "com.fx.demo.rmlui"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            // assets de la demo (rml/rcss) + fuente Lato y animación Lottie
            assets.srcDirs = ['../core/assets', 'src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
